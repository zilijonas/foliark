# ts-rs writes the generated SDK types here on `cargo test` (spec §1). scripts/check-ts-parity.sh overrides it with a temp dir.
[env]
TS_RS_EXPORT_DIR = { value = "packages/sdk/src/generated", relative = true }

# vello_cpu/fearless_simd only take their SIMD paths when simd128 is a compile-time feature (30x on the raster path).
# All evergreen browsers ship wasm SIMD (Chrome 91, Firefox 89, Safari 16.4).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
