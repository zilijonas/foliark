# Push and pull-request CI on Linux runners (macOS minutes cost 10x on private repos).
# Heavy suites (WebKit smoke, the three-browser deployment specs, the package-consumer matrix) run only on a manual
# dispatch: Actions > ci > Run workflow. Acceptance, fuzz and the timing-budget bench stay local (docs/development.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: "Also run WebKit smoke, browser specs and the package-consumer matrix"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/oracle-venv   # several engine tests shell out to the oracle venv
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # cargo test regenerates the ts-rs DTOs; they are committed and must not drift
      - name: Generated types are committed
        run: git diff --exit-code -- packages/sdk/src/generated

  sdk:
    name: sdk (wasm, build, vitest, chromium smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli (prebuilt)
        run: |
          base=https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION
          name=wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl
          curl -fsSL "$base/$name.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - uses: ./.github/actions/oracle-venv   # SDK edit specs read exports with the oracles
      - uses: pnpm/action-setup@v4          # version from "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      # binaryen (wasm-opt) comes from the root devDependencies, so install before the wasm build
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-wasm.sh
      - run: pnpm build:sdk
      - run: pnpm --filter @foliark/sdk test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke chromium
      # the budget gate's own self-test; the timing budgets are frozen on an Apple M4, so the bench itself runs locally
      - run: node --test tools/bench/check-budgets.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-wasm
          path: packages/sdk/wasm
          retention-days: 3

  extended:
    name: extended (webkit, browser specs, consumers)
    if: github.event_name == 'workflow_dispatch' && inputs.extended
    needs: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - uses: actions/download-artifact@v4
        with: { name: sdk-wasm, path: packages/sdk/wasm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sdk
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm smoke webkit
      - run: tests/browser/run.sh
      - run: tests/package-consumers/run.sh
