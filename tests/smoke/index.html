<!doctype html>
<meta charset="utf-8">
<title>Foliark smoke</title>
<script type="module">
  import { createFoliark } from "/packages/sdk/dist/index.js";
  const out = { ok: false };
  try {
    const foliark = await createFoliark({
      wasmUrl: "/packages/sdk/wasm/foliark_wasm_bg.wasm",
      workerUrl: "/packages/sdk/dist/worker.js",
    });
    const bytes = new Uint8Array(await (await fetch("/tests/smoke/one-page.pdf")).arrayBuffer());
    const doc = await foliark.open(bytes);
    const info = await doc.info();
    const geometry = (await doc.pages())[0];
    const page = await doc.renderPage(0, { scale: 1 });
    const px = (x, y) => Array.from(page.data.subarray((y * page.width + x) * 4, (y * page.width + x) * 4 + 4));
    let nonWhite = 0;
    for (let i = 0; i < page.data.length; i += 4) {
      if (page.data[i] !== 255 || page.data[i + 1] !== 255 || page.data[i + 2] !== 255) nonWhite++;
    }
    const helloText = doc.extractText(0).then((t) => t.text);
    const part = await doc.renderPage(0, { scale: 2, clip: { x: 100, y: 0, width: 100, height: 100 }, background: [0, 0, 0, 0] });
    const ppx = (x, y) => Array.from(part.data.subarray((y * part.width + x) * 4, (y * part.width + x) * 4 + 4));
    let outOfRange = "";
    await doc.renderPage(5).catch((e) => (outOfRange = e.code));
    // Native text from the fixture corpus: extract, search a known word, hit-test it.
    const fx = await fetch("/tests/fixtures/hddn/rotation-crop.pdf");
    const fixture = await foliark.open(await fx.arrayBuffer());
    const text = await fixture.extractText(0);
    const hits = await fixture.search("SECRET_ROTATION_CROP");
    const sliced = hits.length > 0 && text.text.slice(hits[0].start, hits[0].end) === hits[0].text;
    const fixtureInfo = await fixture.info();
    const fixtureRender = await fixture.renderPage(0, { scale: 0.5 });
    await fixture.close();
    const closedCode = await fixture.pages().then(() => "none", (e) => e.code);
    // Native export in a real worker: bytes transfer out, reopen, and the page text survives; raster is still refused.
    const plan = await doc.prepareExport({ mode: "native" });
    const exported = await doc.export(plan);
    const reopened = await foliark.open(exported);
    const exportedText = (await reopened.extractText(0)).text;
    const consumed = await doc.export(plan).then(() => "none", (e) => e.code);
    const refused = await doc.prepareExport({ mode: "raster" }).then(() => "none", (e) => e.code);
    await doc.close();
    // Edit preview in a real worker: per-keystroke latency (worker round trip included), and the preview's lines
    // against what the export of the same edit shows when the exported file is read back.
    const sans = new Uint8Array(await (await fetch("/crates/foliark-text/tests/data/LiberationSans-Regular.ttf")).arrayBuffer());
    await foliark.registerFonts([{ bytes: sans, family: "Liberation Sans", weight: 400, style: "normal" }]);
    const edoc = await foliark.open(new Uint8Array(await (await fetch("/tests/fixtures/hddn/shared-image.pdf")).arrayBuffer()));
    const sec = (await edoc.extractText(0)).words.find((w) => w.text === "SECRET_SHARED_IMAGE").box;
    const rects = [{ x: sec.x - 1, y: sec.y - 1, width: sec.width + 2, height: sec.height + 2 }];
    const typed = "Žaliasis rašalas ąčęėįšųūž ".repeat(2) + "testing one two";
    const ms = [];
    for (let n = 1; n <= typed.length; n++) {
      const t0 = performance.now();
      await edoc.layoutEdit(0, rects, typed.slice(0, n), { glyphs: true });
      ms.push(performance.now() - t0);
    }
    ms.sort((a, b) => a - b);
    const preview = await edoc.layoutEdit(0, rects, "ąčęėįšųūž testing\nŽaliasis rašalas", { glyphs: true });
    const commit = await edoc.applyChanges({ baseRevision: 0, textEdits: [{ id: "e", pageIndex: 0, rects, text: "ąčęėįšųūž testing\nŽaliasis rašalas" }] });
    const exportedEdit = await foliark.open(await edoc.export(await edoc.prepareExport({ mode: "native" })));
    const words = (await exportedEdit.extractText(0)).words;
    const lineWords = preview.lines.map((l) => l.text.split(" "));
    const flat = lineWords.flat();
    const found = flat.map((w) => words.find((x) => x.text === w));
    const editExport = {
      previewLines: preview.lines.map((l) => l.text), fingerprintsEqual: preview.fingerprint === commit.layouts[0].fingerprint,
      exportedWords: words.map((w) => w.text).filter((t) => flat.includes(t)), all: found.every(Boolean),
      // Same line breaks and starts: the exported words sit on the preview's baselines and the first of each line at its x.
      dx: preview.lines.map((l, i) => Math.abs(found[lineWords.slice(0, i).flat().length].box.x - l.x)),
      dy: lineWords.flatMap((ws, i) => ws.map((_, j) => Math.abs(found[lineWords.slice(0, i).flat().length + j].box.y + found[0].box.height * 0.8 - preview.lines[i].baseline))),
      calls: ms.length, medianMs: ms[ms.length >> 1], p95Ms: ms[Math.floor(ms.length * 0.95)], maxMs: ms[ms.length - 1],
    };
    await foliark.dispose();
    Object.assign(out, {
      editExport,
      ok: true, pageCount: info.pageCount, pdfVersion: info.pdfVersion,
      fixture: { pages: fixtureInfo.pageCount, text: text.text, hits: hits.length, sliced, render: [fixtureRender.width, fixtureRender.height, fixtureRender.data.length], closedCode },
      refused, exported: { length: exported.byteLength, planLength: plan.byteLength, text: exportedText, consumed }, helloText: await helloText, geometry, width: page.width, height: page.height,
      length: page.data.length, nonWhite, red: px(140, 75), corner: px(190, 5), outOfRange,
      complete: page.complete, warnings: page.warnings, clip: page.clip,
      part: { width: part.width, height: part.height, clip: part.clip, red: ppx(80, 150), corner: ppx(180, 10) },
    });
  } catch (e) {
    out.error = String(e);
  }
  window.__smoke = out;
</script>
