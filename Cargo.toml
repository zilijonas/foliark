[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["Linas Jonas Zilinskas"]
publish = false

# Exact pins from docs/research/cohort-spike.md "RECOMMENDED PINS". Cargo.lock is committed.
[workspace.dependencies]
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts"] }
hayro-syntax = "=0.8.0"
hayro-interpret = { version = "=0.8.0", default-features = false, features = ["embed-fonts"] }
i_overlay = { version = "=9.1.0", default-features = false }
js-sys = "=0.3.106"
pdf-writer = "=0.15.0"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
ts-rs = "=12.0.1"
wasm-bindgen = "=0.2.129"

[patch.crates-io]
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-interpret = { path = "vendor/hayro-interpret" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
# Raster hot path at opt-level 3 (4 ms/page vs 130 at "s", docs/performance/render-spike.md); everything else stays "s" for size.
[profile.release.package.vello_cpu]
opt-level = 3
[profile.release.package.vello_common]
opt-level = 3
[profile.release.package.fearless_simd]
opt-level = 3
[profile.release.package.hayro]
opt-level = 3
[profile.release.package.kurbo]
opt-level = 3
# Image decode/resample path (progressive JPEG entropy decode + downscale dominate an image-heavy page), docs/performance/comparison.md
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.zune-core]
opt-level = 3
[profile.release.package.moxcms]
opt-level = 3
[profile.release.package.pic-scale]
opt-level = 3
# Scanned pages (NEW-81): the reduced-decode resampler lives in hayro-interpret; its image loops and the bilevel decoders run in wasm
[profile.release.package.hayro-interpret]
opt-level = 3
[profile.release.package.hayro-jbig2]
opt-level = 3
[profile.release.package.hayro-ccitt]
opt-level = 3
