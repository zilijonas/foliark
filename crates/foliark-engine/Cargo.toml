[package]
name = "foliark-engine"
description = "Foliark PDF engine: reader and renderer over the vendored hayro."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
foliark-model = { path = "../foliark-model" }
foliark-text = { path = "../foliark-text" }
hayro.workspace = true
pdf-writer.workspace = true
skrifa = "=0.46.2"
subsetter = { version = "=0.2.6", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
unicode-normalization = "=0.1.25"

[dev-dependencies]
serde_json = "=1.0.149"
