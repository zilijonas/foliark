[package]
name = "foliark-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hayro = "=0.8.0"
hayro-syntax = "=0.8.0"
hayro-interpret = "=0.8.0"
hayro-write = "=0.8.0"
pdf-writer = "=0.15.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
